name: Temporary Ui Exact Image Export

on:
  push:
    branches:
      - qa/ui-runtime-dependencies-20260826

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            image: ghcr.io/indigoxred/ui:sha-bbb7fea
            expected_sha: bbb7fea41d15d9861ef2e6aabf36393f8c98adb5
          - variant: current
            image: ghcr.io/indigoxred/ui:sha-bd21b26
            expected_sha: bd21b2674ef8c2b995200299b4b3d327c60c8a1f

    steps:
      - name: Pull exact image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          docker pull "${{ matrix.image }}" 2>&1 | tee export/pull.log
          docker image inspect "${{ matrix.image }}" > export/image-inspect.json
          docker image inspect --format '{{json .Config.Labels}}' "${{ matrix.image }}" > export/image-labels.json
          docker image inspect --format '{{.Id}}' "${{ matrix.image }}" | tee export/image-id.txt
          docker image inspect --format '{{.RepoDigests}}' "${{ matrix.image }}" | tee export/repo-digests.txt
          {
            echo "variant=${{ matrix.variant }}"
            echo "expected_commit=${{ matrix.expected_sha }}"
            echo "source_image=${{ matrix.image }}"
            echo "runner=$(uname -a)"
            echo "docker=$(docker --version)"
          } > export/environment.txt

      - name: Save exact image
        shell: bash
        run: |
          set -euo pipefail
          docker save "${{ matrix.image }}" | gzip -1 > "export/ui-${{ matrix.variant }}.docker.tar.gz"
          sha256sum export/* > export/SHA256SUMS
          du -h export/* | sort -h > export/file-sizes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ui-exact-${{ matrix.variant }}-${{ matrix.expected_sha }}
          path: export
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
