name: Temporary Ui Private Action Access Test

on:
  push:
    branches:
      - qa/ui-runtime-dependencies-20260826

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  access-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Invoke temporary private Ui composite action
        uses: indigoxred/ui/qa-export-action@qa/pr27-pr28-runtime-export-20260826
      - name: Verify action result
        shell: bash
        run: |
          set -euo pipefail
          cat "${RUNNER_TEMP}/private-ui-action-status.txt"
          grep -Fx 'private_ui_action_available=true' "${RUNNER_TEMP}/private-ui-action-status.txt"
