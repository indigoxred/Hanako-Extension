name: Temporary Ui GHCR Image Probe

on:
  push:
    branches:
      - qa/ui-runtime-dependencies-20260826

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe anonymous and repository-token image access
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          candidates=(
            ghcr.io/indigoxred/ui:sha-bbb7fea
            ghcr.io/indigoxred/ui:sha-bbb7fea41d15d9861ef2e6aabf36393f8c98adb5
            ghcr.io/indigoxred/ui:sha-bd21b26
            ghcr.io/indigoxred/ui:sha-bd21b2674ef8c2b995200299b4b3d327c60c8a1f
            ghcr.io/indigoxred/ui:main
            ghcr.io/indigoxred/ui:latest
          )
          : > image-probe.txt
          for image in "${candidates[@]}"; do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "$image anonymous=available" | tee -a image-probe.txt
            else
              echo "$image anonymous=unavailable" | tee -a image-probe.txt
            fi
          done
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin >/dev/null 2>&1 || true
          for image in "${candidates[@]}"; do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "$image token=available" | tee -a image-probe.txt
            else
              echo "$image token=unavailable" | tee -a image-probe.txt
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ui-ghcr-image-probe
          path: image-probe.txt
          retention-days: 1
          if-no-files-found: error
